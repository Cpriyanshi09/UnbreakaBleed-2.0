<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in</title>
    <!-- <link rel="stylesheet" href="home_page.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&family=Lora:wght@400..700&display=swap" rel="stylesheet">
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color:rgb(238, 242, 245) ;
        }
        .container{
            padding: 30px;
            background-color:  rgb(165, 21, 69);
            width: 350px;
            height: 500px;
            border-radius: 10px;
            font-size: 20px;
        }
        h2{
            text-align: center;
        }

        input{
            border: none;
            width: 200px;
            height: 30px;
            margin-top: 10px;
            margin-bottom: 40px;
            color: #B42041;
            border-radius: 5px;
        }

        .buttons{
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100px;
        }

        .buttons button{
            border: none;
            width: 100px;
            height: 30px;
            color: #B42041;
            border-radius: 5px;
        }

        .buttons h6{
            color: rgb(238, 242, 245, 0.6);
            margin-right: 20px; 
        }
    </style>
    
</head>
<body>
    <div class="container" style="color: rgb(238, 242, 245);">
        <h2><u>Sign-in</u></h2>
        <form action="signed-inHomePage.html" method="GET">
            <label for="signing-options">Username</label>
            <br>
            <input type="text" id="signing-options" placeholder="  Enter your username">
            <br>
            <label for="email">Email</label>
            <br>
            <input type="email" id="email" name="email" placeholder="  Enter your email">
            <br>
            <label for="password">Password</label>
            <br>
            <input type="password" id="password" name="password" placeholder="  Enter your password">
            <br>
            <div class="buttons">
                <button type="submit">Submit</button>
                <h6>Create Account</h6>
            </div>
        </form>
</body>
</html>
